name: Desktop App

on:
  push:
    paths:
      - 'desktop-src/**'
      - 'android-src/KV4PHT/app/src/main/java/com/vagell/kv4pht/radio/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop-src/**'
      - 'android-src/KV4PHT/app/src/main/java/com/vagell/kv4pht/radio/**'
  workflow_dispatch:
  schedule:
    # Mondays 05:17 UTC: check that the desktop app still builds against upstream main.
    - cron: '17 5 * * 1'

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64 (.deb)
            os: ubuntu-24.04-arm
            package: packageDeb
            artifact: kv4p-ht-desktop-linux-arm64
          - name: macOS Apple Silicon (.dmg)
            os: macos-15
            package: createDistributable   # signed and turned into a .dmg below
            artifact: kv4p-ht-desktop-macos-arm64
          - name: Linux x64 (.deb)
            os: ubuntu-24.04
            package: packageDeb
            artifact: kv4p-ht-desktop-linux-x64
    defaults:
      run:
        working-directory: desktop-src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test shared radio core
        shell: bash
        run: ../.github/scripts/gradle-annotate.sh ./gradlew :core:test

      - name: Build packages
        shell: bash
        run: ../.github/scripts/gradle-annotate.sh ./gradlew :app:${{ matrix.package }} :app:packageUberJarForCurrentOS -PappVersion=1.0.${{ github.run_number }}

      - name: Sign macOS app (ad-hoc, hardened runtime, microphone entitlement)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(echo app/build/compose/binaries/main/app/*.app)
          # Without a valid signature carrying com.apple.security.device.audio-input,
          # macOS never shows the microphone prompt and the app records silence.
          codesign --force --deep --options runtime --timestamp=none \
            --entitlements app/macos/entitlements.plist --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - --xml "$APP" 2>&1 | grep audio-input > /dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Contents/Info.plist"
          mkdir -p app/build/compose/binaries/main/dmg
          hdiutil create -volname "kv4p HT" -srcfolder "$APP" -ov -format UDZO \
            app/build/compose/binaries/main/dmg/kv4p-ht-desktop-1.0.${{ github.run_number }}.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop-src/app/build/compose/binaries/main/deb/*.deb
            desktop-src/app/build/compose/binaries/main/dmg/*.dmg
            desktop-src/app/build/compose/jars/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.artifact }}
          path: desktop-src/core/build/reports/tests/

  upstream-check:
    # This branch follows upstream *releases* (the firmware people actually run).
    # Weekly: if upstream published a newer release tag, merge it in the runner
    # (nothing is pushed), build, and list Android files that changed but are
    # not shared with the desktop app. Also reports what is waiting on main.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge latest upstream release
        run: |
          git config user.name "upstream-check"
          git config user.email "upstream-check@users.noreply.github.com"
          git remote add upstream https://github.com/VanceVagell/kv4p-ht.git
          git fetch --tags upstream main
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          BASE=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          SHARED='radio/(Protocol|RadioModuleController|OpusUtils|MicGainBoost|RadioMode)\.java|ui/ToneHelper\.java|aprs/parser/|javAX25/ax25/(Packet|Arrays)\.java'
          {
            echo "## Upstream"
            echo
            echo "- This branch is based on release **$BASE**; latest upstream release is **$LATEST**."
            echo "- Commits on upstream main not yet released: $(git rev-list --count $LATEST..upstream/main)"
            echo
            if [ "$LATEST" != "$BASE" ]; then
              echo "### Android files changed since $BASE that the desktop app does NOT share (may need porting)"
              echo '```'
              git diff --stat $BASE $LATEST -- android-src/KV4PHT/app/src/main | grep -vE "$SHARED" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LATEST" != "$BASE" ]; then git merge --no-edit "$LATEST"; fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test against the latest release
        working-directory: desktop-src
        run: ./gradlew :core:test :app:compileKotlin --stacktrace
